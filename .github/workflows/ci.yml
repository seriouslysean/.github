# Lint and test this repo's scripts on every pull request and on main.
# No actions: the commit is fetched with git and the token; shfmt is the release binary,
# checked against the digest GitHub publishes for it. ShellCheck comes with the runner image.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

env:
  SHFMT_VERSION: v3.14.1
  SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SHA"
          git checkout -q FETCH_HEAD
      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repo"
          shellcheck scripts/*.sh
      - name: shfmt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/shfmt"
          gh release download "$SHFMT_VERSION" -R mvdan/sh -p "shfmt_${SHFMT_VERSION}_linux_amd64" -O "$bin"
          echo "$SHFMT_SHA256  $bin" | sha256sum -c -
          chmod +x "$bin"
          cd "$RUNNER_TEMP/repo"
          "$bin" -d -i 2 -ci scripts/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SHA"
          git checkout -q FETCH_HEAD
      - name: scripts/check-pr-body.test.sh
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repo"
          bash scripts/check-pr-body.test.sh
