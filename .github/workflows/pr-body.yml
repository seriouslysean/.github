# Shared check: the PR body carries every heading of the repo's PR template, and passes
# the repo's own scripts/checks/check-pr-body.sh when it has one.
# The template is the repo's own (at the PR base), else this repo's default.
# `gh pr create --body/--body-file` skips the template; this check is what enforces it.
# A repo calls it from a workflow on pull_request [opened, edited, synchronize, reopened]:
#   jobs:
#     pr-body:
#       uses: seriouslysean/.github/.github/workflows/pr-body.yml@<commit sha>
# The check is scripts/check-pr-body.sh, fetched from this repo at the commit the caller
# pinned (job.workflow_sha), so a body checked locally with that script at that commit
# gets the same answer here.
# No actions: files come through the API and the check is plain bash.
# The body reaches the script through env and stdin, never interpolated into the script.
name: PR body

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-body:
    # Dependabot's bodies don't follow the template. Match the PR author, not
    # github.actor: a person who re-runs the job or pushes to a Dependabot branch
    # becomes the actor. A job skipped here still reports success to required checks.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR body against the template
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$WORKFLOW_REPO/contents/scripts/check-pr-body.sh?ref=$WORKFLOW_SHA" \
            >"$RUNNER_TEMP/check-pr-body.sh"
          printf '%s\n' "$PR_BODY" | bash "$RUNNER_TEMP/check-pr-body.sh" "$GITHUB_REPOSITORY" "$BASE_SHA"
